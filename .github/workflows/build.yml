name: Build Sonic Advance Recomp (Clang Root)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. WINDOWS BUILD (.dll na raiz)
  # ====================================================
  build-windows:
    name: Build Windows (Clang)
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SDL2 (Windows)
        run: choco install sdl2 --no-progress

      - name: Compile DLL in Root
        shell: powershell
        run: |
          $files = Get-ChildItem -Path ./*.c | Select-Object -ExpandProperty FullName
          clang -shared -O2 $files -o ./SonicAdvance-bios.dll -lSDL2

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Windows
          path: SonicAdvance-bios.dll

  # ====================================================
  # 2. MACOS BUILD (.dylib na raiz)
  # ====================================================
  build-macos:
    name: Build macOS (Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Compile dylib in Root
        run: |
          clang -dynamiclib -O2 ./*.c -o ./SonicAdvance-bios.dylib -lSDL2 -framework Cocoa

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-macOS
          path: SonicAdvance-bios.dylib

  # ====================================================
  # 3. LINUX BUILD (.so na raiz)
  # ====================================================
  build-linux:
    name: Build Linux (Clang)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsdl2-dev

      - name: Compile Shared Object in Root
        run: |
          clang -shared -fPIC -O2 ./*.c -o ./SonicAdvance-bios.so -lSDL2 -lm

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Linux
          path: SonicAdvance-bios.so
