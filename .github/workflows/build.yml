name: Build Executables (Multiplatform)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. BUILD WINDOWS (SonicAdvance.exe + DLLs)
  # ====================================================
  build-windows:
    name: Windows Build (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (SDL2)
        run: choco install sdl2 cmake --no-progress

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: cmake --build build --config Release

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Windows-x64
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/*.exe
            build/*.dll

  # ====================================================
  # 2. BUILD MACOS (SonicAdvance App / Binário)
  # ====================================================
  build-macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (SDL2)
        run: brew install sdl2 cmake

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: cmake --build build --config Release

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-macOS
          path: |
            build/SonicAdvance
            build/*.dylib

  # ====================================================
  # 3. BUILD LINUX (SonicAdvance Linux Executable)
  # ====================================================
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: cmake --build build --config Release

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Linux
          path: |
            build/SonicAdvance
            build/*.so
