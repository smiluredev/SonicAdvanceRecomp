name: Build Sonic Advance Recomp (Rust)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. WINDOWS BUILD (.exe + .dll)
  # ====================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Windows-x64
          path: |
            target/release/*.exe
            target/release/*.dll

  # ====================================================
  # 2. MACOS BUILD (Nativo / Apple Silicon & Intel)
  # ====================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-macOS
          path: |
            target/release/SonicAdvance*
            target/release/*.dylib

  # ====================================================
  # 3. LINUX BUILD (.so + Binário)
  # ====================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libudev-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Linux
          path: |
            target/release/SonicAdvance*
            target/release/*.so
