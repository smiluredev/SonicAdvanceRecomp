name: Build Sonic Advance Recomp (Clang)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. WINDOWS BUILD (Clang -> .exe / .dll)
  # ====================================================
  build-windows:
    name: Build Windows (Clang)
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SDL2 (Windows)
        run: choco install sdl2 --no-progress

      - name: Compile Executable & DLL with Clang
        shell: cmd
        run: |
          clang -O2 pack-out/work/out/*.c -o SonicAdvance.exe -lSDL2 -lSDL2main -mwindows

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Windows
          path: |
            *.exe
            *.dll

  # ====================================================
  # 2. MACOS BUILD (Clang -> Executável / .dylib)
  # ====================================================
  build-macos:
    name: Build macOS (Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SDL2 (macOS)
        run: brew install sdl2

      - name: Compile Executable with Clang
        run: |
          clang -O2 pack-out/work/out/*.c -o SonicAdvance -lSDL2 -framework Cocoa

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-macOS
          path: |
            SonicAdvance
            *.dylib

  # ====================================================
  # 3. LINUX BUILD (Clang -> Executável / .so)
  # ====================================================
  build-linux:
    name: Build Linux (Clang)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsdl2-dev

      - name: Compile Executable with Clang
        run: |
          clang -O2 pack-out/work/out/*.c -o SonicAdvance -lSDL2 -lm

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvance-Linux
          path: |
            SonicAdvance
            *.so
